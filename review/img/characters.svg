<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="-apple-system,Helvetica Neue,Arial,sans-serif">
<rect width="900" height="430" fill="#fff"/>
<g stroke="#8e8e93" stroke-width="2.5" fill="none"><line x1="345" y1="200" x2="230" y2="200"/><line x1="555" y1="200" x2="670" y2="200"/><line x1="450" y1="260" x2="450" y2="320"/></g>
<rect x="345" y="140" width="210" height="120" rx="16" fill="#e8f0ff" stroke="#007aff" stroke-width="3"/>
<text x="450" y="180" text-anchor="middle" font-size="22" font-weight="700">Mr. Kapasi</text>
<text x="450" y="206" text-anchor="middle" font-size="15" fill="#0a3fae" font-weight="600">protagonist · DYNAMIC</text>
<text x="450" y="230" text-anchor="middle" font-size="14" fill="#3a3a3c">hopeful → crushed</text>
<rect x="20" y="150" width="210" height="100" rx="16" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/>
<text x="125" y="186" text-anchor="middle" font-size="20" font-weight="700">Mr. Das</text>
<text x="125" y="210" text-anchor="middle" font-size="14" fill="#3a3a3c">STATIC · sees life</text>
<text x="125" y="230" text-anchor="middle" font-size="14" fill="#3a3a3c">through his camera</text>
<text x="287" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#c4001a">FOIL</text>
<text x="287" y="222" text-anchor="middle" font-size="12" fill="#6e6e73">opposites</text>
<rect x="670" y="150" width="210" height="100" rx="16" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/>
<text x="775" y="186" text-anchor="middle" font-size="20" font-weight="700">Mrs. Das</text>
<text x="775" y="210" text-anchor="middle" font-size="14" fill="#3a3a3c">STATIC · careless,</text>
<text x="775" y="230" text-anchor="middle" font-size="14" fill="#3a3a3c">hides a secret</text>
<text x="612" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#0a3fae">his crush</text>
<text x="612" y="222" text-anchor="middle" font-size="12" fill="#6e6e73">never mutual</text>
<rect x="345" y="320" width="210" height="80" rx="16" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/>
<text x="450" y="354" text-anchor="middle" font-size="18" font-weight="700">his wife</text>
<text x="450" y="378" text-anchor="middle" font-size="14" fill="#3a3a3c">also an unhappy marriage</text>
<text x="20" y="40" font-size="16" font-weight="700">Kids: Ronny, Tina, Bobby</text>
<text x="20" y="62" font-size="14" fill="#3a3a3c">FLAT characters. Bobby isn't Mr. Das's son.</text>
<text x="880" y="40" text-anchor="end" font-size="14" fill="#3a3a3c"><tspan font-weight="700" fill="#0a3fae">Dynamic</tspan> = changes</text>
<text x="880" y="62" text-anchor="end" font-size="14" fill="#3a3a3c"><tspan font-weight="700">Static</tspan> = stays the same</text>
</svg>
