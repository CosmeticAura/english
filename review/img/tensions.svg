<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system,Helvetica Neue,Arial,sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<g stroke="#ff3b30" stroke-width="3" fill="none">
<line x1="500" y1="110" x2="200" y2="110"/><line x1="500" y1="110" x2="820" y2="110"/><line x1="500" y1="110" x2="500" y2="300"/>
<line x1="200" y1="110" x2="160" y2="300"/><line x1="820" y1="110" x2="820" y2="300"/></g>
<line x1="200" y1="110" x2="500" y2="460" stroke="#ff3b30" stroke-width="3" stroke-dasharray="7 6"/>
<g font-size="20" font-weight="700" text-anchor="middle">
<rect x="410" y="80" width="180" height="60" rx="14" fill="#ffecec" stroke="#c4001a" stroke-width="2.5"/><text x="500" y="117" fill="#c4001a">Mrs. Das</text>
<rect x="110" y="80" width="180" height="60" rx="14" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/><text x="200" y="117">Mr. Das</text>
<rect x="730" y="80" width="180" height="60" rx="14" fill="#e8f0ff" stroke="#007aff" stroke-width="2.5"/><text x="820" y="117" fill="#0a3fae">Mr. Kapasi</text>
<rect x="420" y="270" width="160" height="60" rx="14" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/><text x="500" y="307">Tina</text>
<rect x="80" y="270" width="160" height="60" rx="14" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/><text x="160" y="307">Ronny</text>
<rect x="730" y="270" width="180" height="60" rx="14" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/><text x="820" y="307">Mrs. Kapasi</text>
<rect x="420" y="430" width="160" height="60" rx="14" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/><text x="500" y="467">Bobby</text></g>
<g font-size="15" fill="#1d1d1f" text-anchor="middle">
<text x="350" y="98">bicker</text><text x="350" y="134" font-size="14" fill="#3a3a3c">act like siblings</text>
<text x="660" y="98">his crush</text><text x="660" y="134" font-size="14" fill="#3a3a3c">she doesn't care</text>
<text x="512" y="215" text-anchor="start">ignores her:</text><text x="512" y="235" text-anchor="start" font-size="14" fill="#3a3a3c">"Leave me alone," won't</text><text x="512" y="253" text-anchor="start" font-size="14" fill="#3a3a3c">hold her hand</text>
<text x="808" y="205" text-anchor="end">loveless marriage</text><text x="808" y="225" text-anchor="end" font-size="14" fill="#3a3a3c">she resents his</text><text x="808" y="243" text-anchor="end" font-size="14" fill="#3a3a3c">interpreter job</text>

<text x="70" y="205" text-anchor="start">ignores his</text><text x="70" y="225" text-anchor="start" font-size="14" fill="#3a3a3c">dad (the goat)</text>
<text x="250" y="400" text-anchor="start" fill="#c4001a" font-weight="600">secret:</text><text x="250" y="420" text-anchor="start" font-size="14" fill="#3a3a3c">not Mr. Das's son</text></g>
<text x="20" y="535" font-size="15" fill="#6e6e73">Red lines = tension. Dashed = a tension only Mrs. Das (and later Mr. Kapasi) knows about.</text>
</svg>
