<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system,Helvetica,Arial,sans-serif"><rect width="760" height="360" fill="#fff"/>
<text x="20" y="34" font-size="20" font-weight="700">1947 Partition and the 1971 war (simplified)</text>
<rect x="40" y="80" width="170" height="150" rx="14" fill="#ffe5e3" stroke="#ff3b30" stroke-width="2"/><text x="125" y="140" text-anchor="middle" font-size="16" font-weight="700">West Pakistan</text><text x="125" y="162" text-anchor="middle" font-size="13">mostly Muslim</text><text x="125" y="180" text-anchor="middle" font-size="13">government here</text>
<rect x="240" y="70" width="300" height="230" rx="14" fill="#e5f0ff" stroke="#007aff" stroke-width="2"/><text x="390" y="150" text-anchor="middle" font-size="18" font-weight="700">India</text><text x="390" y="172" text-anchor="middle" font-size="13">mostly Hindu</text><text x="390" y="200" text-anchor="middle" font-size="13">Calcutta: Lilia's parents' city</text>
<rect x="570" y="90" width="160" height="140" rx="14" fill="#e3f7e8" stroke="#34c759" stroke-width="2"/><text x="650" y="140" text-anchor="middle" font-size="16" font-weight="700">East Pakistan</text><text x="650" y="162" text-anchor="middle" font-size="13">Dacca: Mr. Pirzada</text><text x="650" y="182" text-anchor="middle" font-size="13">Bengali, Muslim</text><text x="650" y="210" text-anchor="middle" font-size="13" font-weight="700">→ Bangladesh, 1971</text>
<text x="20" y="335" font-size="13" fill="#555">In 1947 British India split along religion. Pakistan had two halves, 1,000 miles apart, with India in between.</text></svg>