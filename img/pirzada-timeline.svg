<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,Helvetica,Arial,sans-serif"><rect width="960" height="560" fill="#fff"/><text x="24" y="38" font-size="22" font-weight="700">When Mr. Pirzada Came to Dine: autumn 1971 to spring 1972</text><text x="24" y="62" font-size="14" fill="#555">Lilia, 10, outside Boston. Mr. Pirzada waits for news of his wife and 7 daughters in Dacca.</text><line x1="60" y1="130" x2="900" y2="130" stroke="#c7c7cc" stroke-width="3"/><circle cx="110" cy="130" r="20" fill="#007aff"/><text x="110" y="135" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text><text x="110" y="175" text-anchor="middle" font-size="14" font-weight="700">Sept 1971</text><text x="110" y="200" text-anchor="middle" font-size="13">Mr. Pirzada starts</text><text x="110" y="218" text-anchor="middle" font-size="13">coming to dinner</text><text x="110" y="236" text-anchor="middle" font-size="13">every night</text><circle cx="295" cy="130" r="20" fill="#007aff"/><text x="295" y="135" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text><text x="295" y="175" text-anchor="middle" font-size="14" font-weight="700">Each night</text><text x="295" y="200" text-anchor="middle" font-size="13">Candy for Lilia,</text><text x="295" y="218" text-anchor="middle" font-size="13">watch set to</text><text x="295" y="236" text-anchor="middle" font-size="13">Dacca time</text><circle cx="480" cy="130" r="20" fill="#007aff"/><text x="480" y="135" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">3</text><text x="480" y="175" text-anchor="middle" font-size="14" font-weight="700">At school</text><text x="480" y="200" text-anchor="middle" font-size="13">Mrs. Kenyon takes</text><text x="480" y="218" text-anchor="middle" font-size="13">the Pakistan book</text><text x="480" y="236" text-anchor="middle" font-size="13">away</text><circle cx="665" cy="130" r="20" fill="#007aff"/><text x="665" y="135" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">4</text><text x="665" y="175" text-anchor="middle" font-size="14" font-weight="700">Late Oct</text><text x="665" y="200" text-anchor="middle" font-size="13">Pumpkin carving:</text><text x="665" y="218" text-anchor="middle" font-size="13">news makes him</text><text x="665" y="236" text-anchor="middle" font-size="13">drop the knife</text><circle cx="850" cy="130" r="20" fill="#007aff"/><text x="850" y="135" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">5</text><text x="850" y="175" text-anchor="middle" font-size="14" font-weight="700">Oct 31</text><text x="850" y="200" text-anchor="middle" font-size="13">Halloween, two</text><text x="850" y="218" text-anchor="middle" font-size="13">witches; pumpkin</text><text x="850" y="236" text-anchor="middle" font-size="13">smashed</text><line x1="60" y1="360" x2="900" y2="360" stroke="#c7c7cc" stroke-width="3"/><circle cx="110" cy="360" r="20" fill="#ff3b30"/><text x="110" y="365" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">6</text><text x="110" y="405" text-anchor="middle" font-size="14" font-weight="700">Dec 4</text><text x="110" y="430" text-anchor="middle" font-size="13">War declared,</text><text x="110" y="448" text-anchor="middle" font-size="13">India joins East</text><text x="110" y="466" text-anchor="middle" font-size="13">Pakistan</text><circle cx="295" cy="360" r="20" fill="#ff3b30"/><text x="295" y="365" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">7</text><text x="295" y="405" text-anchor="middle" font-size="14" font-weight="700">Dec 16</text><text x="295" y="430" text-anchor="middle" font-size="13">12 days later</text><text x="295" y="448" text-anchor="middle" font-size="13">West Pakistan</text><text x="295" y="466" text-anchor="middle" font-size="13">surrenders</text><circle cx="480" cy="360" r="20" fill="#34c759"/><text x="480" y="365" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">8</text><text x="480" y="405" text-anchor="middle" font-size="14" font-weight="700">January</text><text x="480" y="430" text-anchor="middle" font-size="13">He flies home</text><text x="480" y="448" text-anchor="middle" font-size="13">to Dacca</text><text x="480" y="466" text-anchor="middle" font-size="13">(Bangladesh)</text><circle cx="665" cy="360" r="20" fill="#34c759"/><text x="665" y="365" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">9</text><text x="665" y="405" text-anchor="middle" font-size="14" font-weight="700">Months later</text><text x="665" y="430" text-anchor="middle" font-size="13">Card: his family</text><text x="665" y="448" text-anchor="middle" font-size="13">is safe. He thanks</text><text x="665" y="466" text-anchor="middle" font-size="13">them for meals</text><circle cx="850" cy="360" r="20" fill="#34c759"/><text x="850" y="365" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">10</text><text x="850" y="405" text-anchor="middle" font-size="14" font-weight="700">The end</text><text x="850" y="430" text-anchor="middle" font-size="13">Lilia stops the</text><text x="850" y="448" text-anchor="middle" font-size="13">candy and throws</text><text x="850" y="466" text-anchor="middle" font-size="13">it all away</text><g font-size="13"><circle cx="40" cy="535" r="7" fill="#007aff"/><text x="54" y="540">fall, waiting</text><circle cx="170" cy="535" r="7" fill="#ff3b30"/><text x="184" y="540">the war</text><circle cx="270" cy="535" r="7" fill="#34c759"/><text x="284" y="540">after</text></g></svg>