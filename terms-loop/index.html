<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English: plot and terms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>document.documentElement.setAttribute("data-theme","light")</script>
<style>
/* Hector's personaldesign tokens, fully monochrome. Dark leads. Greys carry the page, full ink marks the current step and the key action. Got it and missed are told apart by words and weight, not colour. */
:root{
  color-scheme:dark;
  --bg:#0b0b0d; --surface:#141518; --raised:#1c1d21;
  --ink:rgb(255 255 255 / .92); --ink-2:rgb(255 255 255 / .62); --ink-3:rgb(255 255 255 / .42); --ink-4:rgb(255 255 255 / .26);
  --line-edge:rgb(255 255 255 / .12); --line-inner:rgb(255 255 255 / .08);
  --accent:#ededf0; --on-accent:#0b0b0d;
  --accent-selection:color-mix(in srgb,var(--accent) 18%,transparent);
  --accent-focus:color-mix(in srgb,var(--accent) 55%,transparent);
  --accent-wash:color-mix(in srgb,var(--accent) 9%,transparent);
  --success:var(--ink); --error:var(--ink-2); --warning:var(--ink-3);
  --space-tight:4px; --space-inline:8px; --space-row:12px; --space-group:20px; --space-page:20px; --space-s:32px; --space-m:48px;
  --radius-control:6px; --radius-group:10px; --radius-surface:14px;
  --motion-state:.12s ease-out; --motion-disclosure:.22s ease-out; --motion-content:.2s ease-in-out; --motion-arrival:.28s cubic-bezier(.2,.9,.3,1);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f6f6f7; --surface:#ffffff; --raised:#ffffff;
    --ink:rgb(0 0 0 / .88); --ink-2:rgb(0 0 0 / .60); --ink-3:rgb(0 0 0 / .42); --ink-4:rgb(0 0 0 / .26);
    --line-edge:rgb(0 0 0 / .12); --line-inner:rgb(0 0 0 / .08);
    --accent:#1d1d1f; --on-accent:#ffffff;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f6f7; --surface:#ffffff; --raised:#ffffff;
  --ink:rgb(0 0 0 / .88); --ink-2:rgb(0 0 0 / .60); --ink-3:rgb(0 0 0 / .42); --ink-4:rgb(0 0 0 / .26);
  --line-edge:rgb(0 0 0 / .12); --line-inner:rgb(0 0 0 / .08);
  --accent:#1d1d1f; --on-accent:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,textarea,select,input{font:inherit;color:inherit;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent-focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}

/* Layout: a quiet sticky bar, a section list on the left, the loop on the right. On a phone the list folds into a disclosure. */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-inner)}
.bar-in,.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.bar-in{display:flex;align-items:center;gap:var(--space-row);min-height:56px;padding-block:var(--space-inline)}
.bar h1{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sub{color:var(--ink-3);font-size:13px;white-space:nowrap}
.bar .grow{flex:1}
.meter{display:flex;align-items:center;gap:var(--space-inline);color:var(--ink-2);font-size:13px;white-space:nowrap}
.meter .track{width:96px;height:4px;border-radius:2px;background:var(--line-edge);overflow:hidden}
.meter .fill{height:100%;background:var(--ink);border-radius:2px;transition:width var(--motion-disclosure)}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--space-s);padding-block:var(--space-s) var(--space-m)}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr);gap:var(--space-group);padding-block:var(--space-group) var(--space-m)}.meter .track{width:56px}.bar .sub{display:none}}

/* Section list */
.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
@media (max-width:860px){.side{position:static;max-height:none;overflow:visible}}
.side details{border:1px solid var(--line-edge);border-radius:var(--radius-group);background:var(--surface)}
.side summary{list-style:none;cursor:pointer;padding:var(--space-row) 14px;display:flex;justify-content:space-between;align-items:center;font-weight:500;min-height:44px}
.side summary::-webkit-details-marker{display:none}
.side summary .chev{color:var(--ink-3);transition:transform var(--motion-disclosure)}
.side details[open] summary .chev{transform:rotate(90deg)}
.side .label{color:var(--ink-3);font-size:12px;font-weight:500;margin:0 0 var(--space-inline) 10px}
.secs{display:grid;gap:2px;padding:0;margin:0;list-style:none}
.side details .secs{padding:0 6px 6px}
.sec{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:var(--radius-control);cursor:pointer;min-height:40px;transition:background var(--motion-state)}
.sec:hover{background:var(--line-inner)}
.sec[aria-current="true"]{background:var(--accent-selection)}
.sec .n{color:var(--ink-3);font-size:13px;text-align:right}
.sec .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink-4)}
.dot.active{border-color:var(--accent);background:var(--accent)}
.dot.done{border-color:var(--success);background:var(--success)}
.dot.revisit{border-color:var(--ink-2);border-style:dashed;background:transparent}

/* Main panel */
.main{min-width:0;display:grid;gap:var(--space-group);align-content:start}
.head{display:flex;align-items:center;gap:var(--space-group)}
.head .txt{min-width:0;display:grid;gap:var(--space-tight)}
.eyebrow{color:var(--ink-3);font-size:13px}
.head h2{font-size:26px;line-height:1.2}
.ring{flex:none;width:112px;height:112px}
.ring text{font-family:var(--font)}
@media (max-width:560px){.ring{width:84px;height:84px}.head h2{font-size:21px}}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.steps button{font-size:12.5px;color:var(--ink-3);padding:4px 10px;min-height:28px;border-radius:var(--radius-control);border:1px solid var(--line-inner);background:none;cursor:pointer;transition:border-color var(--motion-state),color var(--motion-state),background var(--motion-state)}
.steps button:hover{color:var(--ink);border-color:var(--line-edge)}
.steps button.now{color:var(--ink);border-color:var(--accent);background:var(--accent-wash)}
.steps button.past{color:var(--ink-2)}
.head .txt{flex:1}
.secnav{display:flex;gap:var(--space-tight);align-self:flex-start}
.secnav .btn{min-height:32px;padding:0 10px;font-size:13px}
@media (max-width:560px){.head{flex-wrap:wrap}.secnav{width:100%;justify-content:space-between;order:3}}
/* Clocks: a dial that sweeps down smoothly, digits that roll in when they change */
.dial{position:relative;width:min(240px,68vw);aspect-ratio:1;display:grid;place-items:center}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.dial-track{fill:none;stroke:var(--line-edge);stroke-width:3}
.dial-arc{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.dial-head{fill:var(--ink)}
.dial .clock{position:relative}
.dial.soon .dial-arc,.dial.soon .dial-head{animation:soon 1s ease-in-out infinite}
@keyframes soon{50%{opacity:.45}}
.dial.over{animation:over .9s var(--motion-arrival) 1}
@keyframes over{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.clock{display:inline-flex;overflow:hidden}
.clock .d{display:inline-block}
.clock .d.roll{animation:roll .34s cubic-bezier(.2,.9,.3,1)}
@keyframes roll{from{transform:translateY(-55%);opacity:0}to{transform:none;opacity:1}}
.mini{width:44px;height:44px;flex:none}
.mini svg{transform:rotate(-90deg);width:100%;height:100%;overflow:visible}
.mini .dial-arc{stroke-width:4}
.mini.full .dial-arc{animation:none}
/* Sketch canvas for the brain dump */
.sketch{display:grid;gap:var(--space-inline)}
.sketch .tools{display:flex;flex-wrap:wrap;gap:var(--space-tight);align-items:center}
.sketch .tools .btn{min-height:32px;padding:0 12px;font-size:13px}
.sketch .tools .btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash)}
.pad{width:100%;height:340px;display:block;border:1px solid var(--line-edge);border-radius:var(--radius-group);background:var(--bg);touch-action:none;cursor:crosshair}
.pad.ro{height:auto;aspect-ratio:2.4;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line-edge);border-radius:var(--radius-surface);padding:var(--space-s);display:grid;gap:var(--space-group);animation:arrive var(--motion-arrival)}
@media (max-width:560px){.panel{padding:var(--space-group)}}
@keyframes arrive{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel h3{font-size:17px}
.muted{color:var(--ink-2)}
.small{font-size:13px;color:var(--ink-3)}
.actions{display:flex;flex-wrap:wrap;gap:var(--space-inline);align-items:center}
.actions .grow{flex:1}
.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-inline);min-height:40px;padding:0 16px;border-radius:var(--radius-control);border:1px solid var(--line-edge);background:var(--raised);cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;transition:background var(--motion-state),border-color var(--motion-state),transform var(--motion-state)}
.btn:hover{border-color:var(--ink-4)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn.quiet{background:none;border-color:transparent;color:var(--ink-2)}
.btn.quiet:hover{color:var(--ink);background:var(--line-inner)}
.btn[disabled]{opacity:.4;cursor:default}
kbd{font:500 11px/1 var(--font);color:var(--ink-3);border:1px solid var(--line-edge);border-radius:4px;padding:2px 5px}
.btn.primary kbd{color:inherit;border-color:color-mix(in srgb,var(--on-accent) 40%,transparent)}

/* Notes */
.notes{display:grid;gap:var(--space-row);max-width:72ch}
.notes p{margin:0}
.notes h4{margin:var(--space-inline) 0 0;font-size:15px;font-weight:600}
.notes ul{margin:0;padding-left:20px;display:grid;gap:6px}
.notes strong{font-weight:600}
.key{border-left:2px solid var(--accent);padding:var(--space-inline) var(--space-row);background:var(--accent-wash);border-radius:0 var(--radius-control) var(--radius-control) 0}
.tablewrap{overflow-x:auto;border:1px solid var(--line-edge);border-radius:var(--radius-group)}
.notes table{border-collapse:collapse;width:100%;font-size:14px}
.notes th,.notes td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line-inner)}
.notes th{font-weight:600;color:var(--ink-2);font-size:13px}
.notes tr:last-child td{border-bottom:0}
.notes td.group{font-weight:600;color:var(--ink-2);padding-top:14px}
.notes figure{margin:0;display:grid;gap:6px}
.notes figure img{width:100%;max-width:640px;border-radius:var(--radius-group);background:#fff;border:1px solid var(--line-edge)}
.notes figcaption{font-size:13px;color:var(--ink-3)}
.focus{border:1px solid var(--accent-focus);border-radius:var(--radius-group);padding:var(--space-row) 14px;display:grid;gap:6px;background:var(--accent-wash)}
.focus ul{margin:0;padding-left:20px;display:grid;gap:4px}

/* Break timer */
.timer{display:grid;justify-items:center;gap:var(--space-row);padding-block:var(--space-group);text-align:center}
.clock{font-size:64px;font-weight:600;letter-spacing:-.03em;line-height:1}
@media (max-width:560px){.clock{font-size:52px}}
.timer .bar2{width:min(360px,100%);height:4px;border-radius:2px;background:var(--line-edge);overflow:hidden}
.timer .bar2 i{display:block;height:100%;background:var(--ink);transition:width 1s linear}

/* Flashcards */
.card{position:relative;min-height:230px;border:1px solid var(--line-edge);border-radius:var(--radius-surface);background:var(--raised);display:grid;place-items:center;padding:var(--space-s) var(--space-group);text-align:center;cursor:pointer;user-select:none;transition:border-color var(--motion-state)}
.card:hover{border-color:var(--ink-4)}
.card .side-l{position:absolute;top:12px;left:16px;font-size:12px;color:var(--ink-3)}
.card .front{font-size:22px;font-weight:600;line-height:1.3;max-width:34ch}
.card .term{font-size:13px;color:var(--ink-3);margin-bottom:var(--space-inline)}
.card .back{font-size:17px;line-height:1.5;max-width:52ch;color:var(--ink);white-space:pre-line}
.card .hint{position:absolute;bottom:12px;font-size:12px;color:var(--ink-3)}
.card.flash-ok{animation:ok .35s ease-out}
.card.flash-no{animation:no .35s ease-out}
@keyframes ok{0%{border-color:var(--success)}100%{border-color:var(--line-edge)}}
@keyframes no{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fcbar{display:flex;align-items:center;gap:var(--space-row);font-size:13px;color:var(--ink-3)}
.fcbar .track{flex:1;height:4px;border-radius:2px;background:var(--line-edge);overflow:hidden}
.fcbar .track i{display:block;height:100%;background:var(--ink);transition:width var(--motion-disclosure)}
.btn.ok{border-color:color-mix(in srgb,var(--success) 50%,transparent)}
.btn.no{border-color:color-mix(in srgb,var(--error) 50%,transparent)}
.tally{display:flex;gap:var(--space-group);flex-wrap:wrap}
.tally div{display:grid;gap:2px}
.tally b{font-size:28px;font-weight:600}
.okc{color:var(--success)} .noc{color:var(--error)}
.quiz{display:flex;flex-wrap:wrap;gap:var(--space-inline);align-items:center;padding-top:var(--space-row);border-top:1px solid var(--line-inner)}
.copybox{width:100%;min-height:120px;border:1px solid var(--line-edge);border-radius:var(--radius-control);background:var(--bg);padding:10px;font-size:12px}

/* Brain dump */
textarea.dump{width:100%;min-height:300px;resize:vertical;border:1px solid var(--line-edge);border-radius:var(--radius-group);background:var(--bg);padding:14px 16px;line-height:1.6;font-size:15px}
textarea.dump:focus{outline:none;border-color:var(--accent-focus)}
.dumptime{display:flex;align-items:baseline;gap:var(--space-inline)}
.dumptime b{font-size:22px;font-weight:600}

/* Mark */
.mark{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-group)}
@media (max-width:760px){.mark{grid-template-columns:minmax(0,1fr)}}
.mine{border:1px solid var(--line-inner);border-radius:var(--radius-group);padding:14px 16px;white-space:pre-wrap;color:var(--ink-2);font-size:14px;max-height:460px;overflow:auto;background:var(--bg)}
.pts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.pt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line-inner);border-radius:var(--radius-control);background:none;cursor:pointer;font-size:14px;line-height:1.45;transition:background var(--motion-state),border-color var(--motion-state)}
.pt:hover{border-color:var(--line-edge)}
.pt .box{width:18px;height:18px;margin-top:1px;border-radius:5px;border:1.5px solid var(--ink-4);display:grid;place-items:center}
.pt[aria-pressed="true"]{border-color:color-mix(in srgb,var(--success) 45%,transparent);background:color-mix(in srgb,var(--success) 8%,transparent)}
.pt[aria-pressed="true"] .box{background:var(--success);border-color:var(--success)}
.pt[aria-pressed="true"] .box::after{content:"";width:5px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.score{font-size:15px}

/* Overview */
.how{display:grid;gap:6px;margin:0;padding-left:20px}
.rows{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:var(--space-row);align-items:center;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line-inner);border-radius:var(--radius-group);background:none;cursor:pointer;min-height:52px;transition:border-color var(--motion-state),background var(--motion-state)}
.row:hover{border-color:var(--line-edge);background:var(--line-inner)}
.row .n{color:var(--ink-3);font-size:13px;text-align:right}
.row .t{font-weight:500;min-width:0}
.row .meta{font-size:12.5px;color:var(--ink-3)}
.chip{font-size:12px;padding:3px 8px;border-radius:var(--radius-control);border:1px solid var(--line-edge);color:var(--ink-2);white-space:nowrap}
.chip.active{border-color:var(--accent-focus);color:var(--ink)}
.chip.done{border-color:color-mix(in srgb,var(--success) 50%,transparent);color:var(--success)}
.chip.revisit{border-style:dashed;color:var(--ink)}
.settings{display:flex;flex-wrap:wrap;gap:var(--space-group);align-items:center;font-size:13px;color:var(--ink-2)}
.settings label{display:flex;gap:var(--space-inline);align-items:center}
.settings select{background:var(--raised);border:1px solid var(--line-edge);border-radius:var(--radius-control);padding:6px 8px;min-height:32px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);border:1px solid var(--line-edge);border-radius:var(--radius-group);padding:10px 16px;font-size:14px;box-shadow:0 8px 24px rgb(0 0 0 / .25);z-index:10;animation:arrive var(--motion-arrival)}
.confirm{display:flex;flex-wrap:wrap;gap:var(--space-inline);align-items:center;padding:var(--space-row) 14px;border:1px solid color-mix(in srgb,var(--error) 45%,transparent);border-radius:var(--radius-group)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}

/* Apple light look */
:root:root:root:root{color-scheme:light;--bg:#f2f2f7;--surface:#fff;--raised:#fff;--ink:#000;--ink-2:rgba(60,60,67,.78);--ink-3:rgba(60,60,67,.6);--ink-4:rgba(60,60,67,.3);--line-edge:rgba(60,60,67,.16);--line-inner:rgba(60,60,67,.1);--accent:#007aff;--on-accent:#fff;--success:#34c759;--error:#ff3b30;--fill:rgba(118,118,128,.12);--radius-control:10px;--radius-group:12px;--radius-surface:14px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif}
body{font-size:17px;line-height:1.47;letter-spacing:-.01em}
.bar{background:rgba(249,249,249,.85);border-bottom:.5px solid var(--line-edge)}
.bar h1{font-size:17px}
.meter .fill{background:var(--accent)}
.head h2{font-size:30px;font-weight:700;letter-spacing:.005em}
.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:.03em}
.panel{border:0;border-radius:var(--radius-surface);box-shadow:0 1px 2px rgba(0,0,0,.04);padding:22px}
.panel h3{font-size:20px;font-weight:700}
.btn{border:0;border-radius:999px;background:var(--fill);color:var(--accent);font-weight:600;font-size:15px;min-height:42px;padding:0 18px}
.btn:hover{border:0;background:rgba(118,118,128,.18)}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:#0a6fe6}
.btn.quiet{background:none;color:var(--accent)}.btn.quiet:hover{background:var(--fill);color:var(--accent)}
.btn.ok{background:rgba(52,199,89,.15);color:#1f8a3b}.btn.no{background:rgba(255,59,48,.12);color:#d70015}
kbd{border:0;background:rgba(255,255,255,.25);color:inherit;opacity:.8}
.btn:not(.primary) kbd{background:rgba(0,0,0,.06)}
.steps{background:var(--fill);border-radius:10px;padding:3px;gap:2px;display:inline-flex}
.steps button{border:0;border-radius:8px;color:var(--ink);font-size:13px;font-weight:500;min-height:30px;padding:4px 10px}
.steps button.past{color:var(--ink-2)}
.steps button.now{background:#fff;color:#000;box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.steps button:hover{border:0}
.side details,.rows .row{border:0;background:#fff}
.side details{border-radius:12px}
.sec{border-radius:10px}
.sec[aria-current="true"]{background:rgba(0,122,255,.12);color:var(--accent);font-weight:600}
.dot.active{background:var(--accent);border-color:var(--accent)}.dot.done{background:var(--success);border-color:var(--success)}.dot.revisit{border-color:var(--warning,#ff9500)}
.rows{gap:0;background:#fff;border-radius:12px;overflow:hidden}
.rows li + li .row{border-top:.5px solid var(--line-edge);border-radius:0}

(function(){
"use strict";
const STEPS=["Read","Break","Flashcards","Break","Brain dump","Mark"];
const KEY="studyloop:"+DECK.title;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const secs=DECK.sections;
let S=load();
let tick=null,raf=0;

function blank(){return {cur:null,sec:{},settings:{breakMin:DECK.breakMinutes||5,dumpMin:DECK.dumpMinutes||7,sound:true}}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&v.sec)return Object.assign(blank(),v)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function st(id){if(!S.sec[id])S.sec[id]={round:1,step:0,status:"new",fc:null,passes:0,dump:"",got:{},focus:[],history:[],timerEnd:0,timerLen:0,dumpStart:0};return S.sec[id]}
function secById(id){return secs.find(s=>s.id===id)}
function idx(id){return secs.findIndex(s=>s.id===id)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(ms){ms=Math.max(0,Math.round(ms/1000));return Math.floor(ms/60)+":"+String(ms%60).padStart(2,"0")}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

/* Sound: one soft chime when a timer ends. */
let ac=null;
function chime(){if(!S.settings.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[660,880].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;const t=ac.currentTime+i*.18;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.65)})}catch(e){}}

function statusOf(id){const s=S.sec[id];return s?s.status:"new"}
function statusLabel(id){const s=S.sec[id];if(!s||s.status==="new")return "Not started";if(s.status==="done")return "Done";if(s.status==="revisit")return "Loop again";return "Round "+s.round+", "+STEPS[s.step].toLowerCase()}

function renderBar(){
  $("#title").textContent=DECK.title;
  $("#sub").textContent=DECK.subtitle||"";
  const done=secs.filter(s=>statusOf(s.id)==="done").length;
  $("#meter").innerHTML='<span class="num">'+done+" of "+secs.length+' done</span><span class="track"><span class="fill" style="width:'+(100*done/secs.length)+'%"></span></span>';
}
function renderSide(){
  const list='<ul class="secs">'+secs.map((s,i)=>'<li><button class="sec" data-go="'+esc(s.id)+'" aria-current="'+(S.cur===s.id)+'"><span class="n num">'+(i+1)+'</span><span class="t">'+esc(s.title)+'</span><span class="dot '+statusOf(s.id)+'" title="'+esc(statusLabel(s.id))+'"></span></button></li>').join("")+"</ul>";
  const over='<button class="sec" data-go="" aria-current="'+(S.cur===null)+'"><span class="n">&#8962;</span><span class="t">Overview</span><span></span></button>';
  const narrow=matchMedia("(max-width:860px)").matches;
  if(narrow){const cur=S.cur?(idx(S.cur)+1)+". "+secById(S.cur).title:"Overview";
    $("#side").innerHTML='<details id="secdd"><summary><span>'+esc(cur)+'</span><span class="chev">&#8250;</span></summary>'+'<div class="secs" style="padding:0 6px 6px">'+over+"</div>"+list+"</details>";}
  else $("#side").innerHTML='<div class="secs" style="margin-bottom:12px">'+over+'</div><p class="label">Sections</p>'+list;
}

function ring(step,round){
  const R=40,c=56,nodes=STEPS.map((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/6;return [c+R*Math.cos(a),c+R*Math.sin(a)]});
  let arcs="";for(let i=0;i<6;i++){const [x1,y1]=nodes[i],[x2,y2]=nodes[(i+1)%6];arcs+='<path d="M'+x1.toFixed(1)+" "+y1.toFixed(1)+" A"+R+" "+R+" 0 0 1 "+x2.toFixed(1)+" "+y2.toFixed(1)+'" fill="none" stroke="'+(i<step?"var(--ink-2)":"var(--line-edge)")+'" stroke-width="2"/>'}
  const dots=nodes.map(([x,y],i)=>'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(i===step?7:4.5)+'" fill="'+(i===step?"var(--accent)":i<step?"var(--ink-2)":"var(--surface)")+'" stroke="'+(i===step?"var(--accent)":i<step?"var(--ink-2)":"var(--ink-4)")+'" stroke-width="1.5"/>').join("");
  return '<svg class="ring" viewBox="0 0 112 112" role="img" aria-label="Step '+(step+1)+' of 6, round '+round+'">'+arcs+dots+'<text x="56" y="53" text-anchor="middle" font-size="10" fill="var(--ink-3)">Round</text><text x="56" y="70" text-anchor="middle" font-size="17" font-weight="600" fill="var(--ink)">'+round+"</text></svg>";
}

function notesHTML(blocks){
  return blocks.map(b=>{
    if(b.h)return "<h4>"+rich(b.h)+"</h4>";
    if(b.p)return "<p>"+rich(b.p)+"</p>";
    if(b.key)return '<p class="key">'+rich(b.key)+"</p>";
    if(b.list)return "<ul>"+b.list.map(x=>"<li>"+rich(x)+"</li>").join("")+"</ul>";
    if(b.table){const t=b.table;return '<div class="tablewrap"><table><thead><tr>'+t.head.map(h=>"<th>"+rich(h)+"</th>").join("")+"</tr></thead><tbody>"+t.rows.map(r=>r.length===1?'<tr><td class="group" colspan="'+t.head.length+'">'+rich(r[0])+"</td></tr>":"<tr>"+r.map(c=>"<td>"+rich(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>"}
    if(b.img)return '<figure><img src="'+esc(b.img)+'" alt="'+esc(b.alt||"")+'" loading="lazy">'+(b.caption?"<figcaption>"+rich(b.caption)+"</figcaption>":"")+"</figure>";
    return "";
  }).join("");
}

function header(sec,s){
  const i=idx(sec.id);
  const steps='<ol class="steps">'+STEPS.map((n,k)=>'<li><button data-step="'+k+'" class="'+(k===s.step?"now":k<s.step?"past":"")+'" aria-current="'+(k===s.step?"step":"false")+'" title="Go to '+n.toLowerCase()+'">'+n+"</button></li>").join("")+"</ol>";
  const prev=i>0?secs[i-1]:null,nxt=i<secs.length-1?secs[i+1]:null;
  const nav='<div class="secnav"><button class="btn quiet" data-sec="'+(prev?esc(prev.id):"")+'"'+(prev?' title="'+esc(prev.title)+'"':" disabled")+'>&lsaquo; Previous</button><button class="btn quiet" data-sec="'+(nxt?esc(nxt.id):"")+'"'+(nxt?' title="'+esc(nxt.title)+'"':" disabled")+'>Next &rsaquo;</button></div>';
  return '<div class="head">'+ring(s.step,s.round)+'<div class="txt"><span class="eyebrow num">Section '+(i+1)+" of "+secs.length+'</span><h2>'+esc(sec.title)+"</h2>"+steps+"</div>"+nav+"</div>";
}

function render(){
  clearInterval(tick);tick=null;cancelAnimationFrame(raf);raf=0;
  renderBar();renderSide();
  const m=$("#main");
  if(!S.cur){m.innerHTML=overview();bindOverview();return}
  const sec=secById(S.cur);if(!sec){S.cur=null;return render()}
  const s=st(sec.id);
  let body="";
  switch(s.step){
    case 0:body=stepRead(sec,s);break;
    case 1:case 3:body=stepBreak(sec,s);break;
    case 2:body=stepCards(sec,s);break;
    case 4:body=stepDump(sec,s);break;
    case 5:body=stepMark(sec,s);break;
  }
  m.innerHTML=header(sec,s)+body;
  m.querySelectorAll(".steps [data-step]").forEach(b=>b.onclick=()=>jump(sec,s,+b.dataset.step));
  m.querySelectorAll(".secnav [data-sec]").forEach(b=>b.onclick=()=>{if(b.dataset.sec)go(b.dataset.sec)});
  bindStep(sec,s);
}
/* Jump to any step, forward or back, without losing the brain dump or sketch */
function jump(sec,s,k){if(k===s.step)return;s.step=k;if((k===1||k===3)&&!(s.timerEnd>Date.now())){s.timerLen=S.settings.breakMin*60000;s.timerEnd=Date.now()+s.timerLen}if(k===4&&!s.dumpStart)s.dumpStart=Date.now();save();render();scrollTo({top:0,behavior:"smooth"})}
/* Clock helpers */
const still=matchMedia("(prefers-reduced-motion: reduce)");
function setClock(el,str){if(!el)return;const cur=[...el.querySelectorAll(".d")].map(d=>d.textContent).join("");if(cur===str)return;const old=el.querySelectorAll(".d");if(old.length!==str.length){el.innerHTML=[...str].map(ch=>'<span class="d">'+ch+"</span>").join("");return}[...str].forEach((ch,i)=>{if(old[i].textContent!==ch){const n=document.createElement("span");n.className="d"+(still.matches?"":" roll");n.textContent=ch;old[i].replaceWith(n)}})}
function dialSVG(r,id,head){return '<svg viewBox="0 0 '+(2*r+12)+" "+(2*r+12)+'" aria-hidden="true"><circle class="dial-track" cx="'+(r+6)+'" cy="'+(r+6)+'" r="'+r+'"/><circle class="dial-arc" id="'+id+'" cx="'+(r+6)+'" cy="'+(r+6)+'" r="'+r+'" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="0"/>'+(head?'<circle class="dial-head" id="'+id+'h" r="5" cx="'+(2*r+6)+'" cy="'+(r+6)+'"/>':"")+"</svg>"}
function setDial(id,frac,r){const a=document.getElementById(id);if(!a)return;frac=Math.max(0,Math.min(1,frac));a.setAttribute("stroke-dashoffset",String(1-frac));const h=document.getElementById(id+"h");if(h){const ang=frac*2*Math.PI;h.setAttribute("cx",(r+6+r*Math.cos(ang)).toFixed(2));h.setAttribute("cy",(r+6+r*Math.sin(ang)).toFixed(2));h.style.opacity=frac>0?1:0}}

function go(id){S.cur=id||null;if(id){const s=st(id);if(s.status==="new"||s.status==="revisit"){if(s.status==="revisit"){s.status="active";}else s.status="active"}}save();render();scrollTo({top:0,behavior:"smooth"})}
function next(sec,s){s.step++;if(s.step===1||s.step===3){s.timerLen=S.settings.breakMin*60000;s.timerEnd=Date.now()+s.timerLen}if(s.step===2){s.fc=null}if(s.step===4&&!s.dumpStart){s.dumpStart=Date.now()}save();render();scrollTo({top:0,behavior:"smooth"})}

/* Overview */
function overview(){
  const done=secs.filter(s=>statusOf(s.id)==="done").length;
  const nextSec=secs.find(s=>statusOf(s.id)==="active")||secs.find(s=>statusOf(s.id)==="new")||secs.find(s=>statusOf(s.id)==="revisit");
  const rows=secs.map((s,i)=>{const st0=statusOf(s.id);return '<li><button class="row" data-go="'+esc(s.id)+'"><span class="n num">'+(i+1)+'</span><span class="t">'+esc(s.title)+'<br><span class="meta num">'+s.cards.length+" cards, "+s.points.length+' key points</span></span><span class="chip '+st0+'">'+esc(statusLabel(s.id))+"</span></button></li>"}).join("");
  return '<div class="head"><div class="txt"><span class="eyebrow num">'+done+" of "+secs.length+' sections done</span><h2>'+esc(DECK.title)+"</h2>"+(DECK.source?'<span class="small">'+esc(DECK.source)+"</span>":"")+"</div></div>"+
  '<section class="panel"><h3>How each section works</h3><ol class="how"><li>Read the notes for the section.</li><li>Take a brain break.</li><li>Do the flashcards, once or twice.</li><li>Take another brain break.</li><li>Brain dump: write everything you remember with the notes closed.</li><li>Mark what you missed, then loop on it or move to the next section.</li></ol>'+
  '<div class="actions">'+(nextSec?'<button class="btn primary" data-go="'+esc(nextSec.id)+'">'+(statusOf(nextSec.id)==="new"?"Start ":"Continue ")+(idx(nextSec.id)+1)+". "+esc(nextSec.title)+"</button>":'<span class="muted">Every section is done. Loop any one again to keep it fresh.</span>')+"</div>"+
  '<div class="settings"><label>Breaks <select id="bk">'+[3,5,7,10].map(v=>'<option value="'+v+'"'+(S.settings.breakMin===v?" selected":"")+">"+v+" min</option>").join("")+'</select></label><label>Brain dump goal <select id="dm">'+[5,7,10].map(v=>'<option value="'+v+'"'+(S.settings.dumpMin===v?" selected":"")+">"+v+" min</option>").join("")+'</select></label><label><input type="checkbox" id="snd"'+(S.settings.sound?" checked":"")+"> Chime when a break ends</label></div></section>"+
  '<section class="panel"><h3>Sections</h3><ul class="rows">'+rows+'</ul><div class="actions"><span class="grow"></span><button class="btn quiet" id="reset">Reset progress</button></div><div id="confirm"></div></section>';
}
function bindOverview(){
  document.querySelectorAll("#main [data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  $("#bk").onchange=e=>{S.settings.breakMin=+e.target.value;save()};
  $("#dm").onchange=e=>{S.settings.dumpMin=+e.target.value;save()};
  $("#snd").onchange=e=>{S.settings.sound=e.target.checked;save()};
  $("#reset").onclick=()=>{$("#confirm").innerHTML='<div class="confirm"><span>Clear every round, brain dump and mark?</span><span class="grow"></span><button class="btn" id="rno">Keep</button><button class="btn" id="ryes" style="border-color:var(--error);color:var(--error)">Clear progress</button></div>';$("#rno").onclick=()=>$("#confirm").innerHTML="";$("#ryes").onclick=()=>{S=blank();save();render();toast("Progress cleared")}};
}

/* Step 1: read */
function stepRead(sec,s){
  const focus=s.round>1&&s.focus.length?'<div class="focus"><b>Round '+s.round+": focus on what you missed</b><ul>"+s.focus.map(k=>"<li>"+rich(sec.points[k])+"</li>").join("")+"</ul></div>":"";
  return '<section class="panel">'+focus+'<div class="notes">'+notesHTML(sec.notes)+'</div><div class="actions"><button class="btn primary" id="go">Done reading <kbd>Enter</kbd></button><span class="small">Next: a '+S.settings.breakMin+" minute brain break</span></div></section>";
}

/* Steps 2 and 4: break */
function stepBreak(sec,s){
  const after=s.step===1?"flashcards":"brain dump";
  return '<section class="panel"><div class="timer"><span class="eyebrow">Brain break</span><div class="dial" id="dial">'+dialSVG(100,"arc",true)+'<div class="clock num" id="clock"></div></div><p class="muted" style="margin:0;max-width:44ch">Stand up, get some water, look away from the screen. No notes and no phone.</p></div>'+
  '<div class="actions" style="justify-content:center"><button class="btn quiet" id="plus">Add a minute</button><button class="btn" id="go">'+(s.step===1?"Start flashcards":"Start brain dump")+' <kbd>Enter</kbd></button></div><p class="small" style="text-align:center;margin:0" id="tnote">Next: '+after+"</p></section>";
}

/* Step 3: flashcards */
function newPass(sec,s,which){const pool=which==="missed"&&s.fc&&s.fc.missed.length?s.fc.missed:sec.cards.map((c,i)=>i);s.fc={order:shuffle(pool),pos:0,flip:false,got:[],missed:[]};s.passes++;save()}
function stepCards(sec,s){
  if(s.fc&&s.fc.order.some(k=>k>=sec.cards.length))s.fc=null;if(!s.fc){s.passes=0;newPass(sec,s,"all")}
  const f=s.fc,quiz='<div class="quiz"><span class="small">Quizlet</span>'+(sec.quizlet?'<a class="btn" href="'+esc(sec.quizlet)+'" target="_blank" rel="noopener">Open the Quizlet set</a>':"")+'<button class="btn quiet" id="qcopy">Copy cards for Quizlet import</button><div id="qbox" style="width:100%"></div></div>';
  if(f.pos>=f.order.length){
    const g=f.got.length,n=f.order.length;
    return '<section class="panel"><span class="eyebrow num">Pass '+s.passes+" done</span><div class=\"tally\"><div><b class=\"okc num\">"+g+'</b><span class="small">got it</span></div><div><b class="noc num">'+f.missed.length+'</b><span class="small">missed</span></div><div><b class="num">'+n+'</b><span class="small">cards</span></div></div>'+
    (f.missed.length?'<div class="notes"><p class="muted">Missed this pass:</p><ul>'+f.missed.map(k=>"<li>"+rich(sec.cards[k][0])+"</li>").join("")+"</ul></div>":"")+
    '<div class="actions">'+(s.passes<2?(f.missed.length?'<button class="btn" id="again-m">Second pass on the '+f.missed.length+" missed</button>":"")+'<button class="btn" id="again-a">Second pass on all</button>':"")+'<button class="btn quiet" id="undo">&#8630; Back to last card <kbd>Ctrl Z</kbd></button><button class="btn primary" id="go">Take a break <kbd>Enter</kbd></button></div>'+quiz+"</section>";
  }
  const c=sec.cards[f.order[f.pos]];
  return '<section class="panel"><div class="fcbar num"><span>Pass '+s.passes+'</span><span class="track"><i style="width:'+(100*f.pos/f.order.length)+'%"></i></span><span>'+(f.pos+1)+" / "+f.order.length+'</span></div>'+
  '<div class="card" id="card" role="button" tabindex="0" aria-label="Flip card"><span class="side-l">'+(f.flip?"Answer":"Term")+'</span>'+(f.flip?'<div><div class="term">'+rich(c[0])+'</div><div class="back">'+rich(c[1])+"</div></div>":'<div class="front">'+rich(c[0])+"</div>")+'<span class="hint">'+(f.flip?"":"Click or press space to flip")+'</span></div>'+
  '<div class="actions" style="justify-content:center"><button class="btn no" id="miss"'+(f.flip?"":" disabled")+'>Missed <kbd>&larr;</kbd></button><button class="btn ok" id="got"'+(f.flip?"":" disabled")+'>Got it <kbd>&rarr;</kbd></button></div><div class="actions" style="justify-content:center;margin-top:-8px"><button class="btn quiet" id="undo"'+(f.pos?"":" disabled")+'>&#8630; Back to last card <kbd>Ctrl Z</kbd></button></div>'+quiz+"</section>";
}

/* Step 5: brain dump */
function stepDump(sec,s){
  return '<section class="panel"><div class="actions"><div class="mini" id="mini">'+dialSVG(18,"marc",false)+'</div><div class="dumptime"><b class="clock num" id="dt"></b><span class="small" id="goal">goal '+S.settings.dumpMin+' min</span></div><span class="grow"></span><span class="small">Notes stay hidden until you finish</span></div>'+
  '<label for="dump" class="muted">Write everything you remember about '+esc(sec.title.toLowerCase())+'. Definitions, examples, anything.</label><textarea class="dump" id="dump" placeholder="Start anywhere...">'+esc(s.dump)+'</textarea>'+
  '<div class="sketch"><span class="muted">Sketch what you need to draw: flowcharts, particle diagrams, lab setups, graphs.</span><div class="tools"><button class="btn" id="tpen" aria-pressed="true">Pen</button><button class="btn" id="tera" aria-pressed="false">Eraser</button><span class="grow" style="flex:1"></span><button class="btn quiet" id="tundo">Undo</button><button class="btn quiet" id="tclr">Clear</button></div><canvas class="pad" id="pad" aria-label="Sketch area"></canvas><div id="clrc"></div></div>'+
  '<div class="actions"><button class="btn primary" id="go">Done, check it <kbd>Ctrl Enter</kbd></button></div></section>';
}

/* Step 6: mark */
function stepMark(sec,s){
  const total=sec.points.length,got=sec.points.filter((p,k)=>s.got[k]).length,missed=total-got;
  return '<section class="panel"><p class="muted" style="margin:0">Check each key point you got in your brain dump. Be strict: only count it if you wrote it down.</p><div class="mark"><div style="display:grid;gap:8px;align-content:start"><span class="small">Your brain dump</span><div class="mine">'+(s.dump.trim()?esc(s.dump):'<span class="small">Nothing written</span>')+'</div>'+(s.sketch&&s.sketch.k&&s.sketch.k.length?'<span class="small">Your sketch</span><canvas class="pad ro" id="padro" aria-label="Your sketch"></canvas>':"")+'</div><div style="display:grid;gap:8px;align-content:start"><span class="small">Key points</span><ul class="pts">'+sec.points.map((p,k)=>'<li><button class="pt" data-k="'+k+'" aria-pressed="'+!!s.got[k]+'"><span class="box"></span><span>'+rich(p)+"</span></button></li>").join("")+'</ul></div></div>'+
  '<div class="actions"><span class="score num">You got <b>'+got+"</b> of "+total+(missed?", missed <b class=\"noc\">"+missed+"</b>":"")+'</span><span class="grow"></span>'+(missed?'<button class="btn" id="moveon">Move on for now</button><button class="btn primary" id="loop">Loop again on the '+missed+" missed</button>":'<button class="btn primary" id="finish">'+(nextNew(sec)?"Next section":"Finish")+"</button>")+"</div></section>";
}
function nextNew(sec){const i=idx(sec.id);for(let k=1;k<=secs.length;k++){const n=secs[(i+k)%secs.length];if(statusOf(n.id)!=="done"&&n.id!==sec.id)return n}return null}

function bindStep(sec,s){
  const goBtn=$("#go");
  if(s.step===0){goBtn.onclick=()=>next(sec,s)}
  if(s.step===1||s.step===3){
    let rang=false;
    const dial=$("#dial");
    const frame=()=>{const left=s.timerEnd-Date.now();const c=$("#clock");if(!c)return;setClock(c,fmt(left));setDial("arc",left/s.timerLen,100);
      dial.classList.toggle("soon",left>0&&left<=10000);
      if(left<=0){if(!rang){if(Date.now()-s.timerEnd<3000){chime();if(!still.matches)dial.classList.add("over")}rang=true;$("#tnote").textContent="Break is over";goBtn.classList.add("primary")}return}
      if(!still.matches)raf=requestAnimationFrame(frame)};
    frame();if(still.matches)tick=setInterval(frame,1000);
    $("#plus").onclick=()=>{const now=Date.now();if(s.timerEnd<now)s.timerEnd=now;s.timerEnd+=60000;s.timerLen+=60000;save();render()};
    goBtn.onclick=()=>next(sec,s);
  }
  if(s.step===2){
    const f=s.fc;
    const qc=$("#qcopy");if(qc)qc.onclick=()=>{const txt=sec.cards.map(c=>c[0]+"\t"+String(c[1]).replace(/\s*\n\s*/g," ")).join("\n");const done=()=>toast("Copied "+sec.cards.length+" cards. In Quizlet: Import, paste, Tab between term and definition.");if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallback(txt))}else fallback(txt)};
    const undo=()=>{if(!f.pos)return;f.pos--;const k=f.order[f.pos],h=(f.hist||[]).pop();if(h===1||(h===undefined&&f.got[f.got.length-1]===k))f.got.pop();else f.missed.pop();f.flip=true;save();render()};
    bindStep.undo=undo;if($("#undo"))$("#undo").onclick=undo;
    if(f.pos>=f.order.length){
      if($("#again-m"))$("#again-m").onclick=()=>{newPass(sec,s,"missed");render()};
      if($("#again-a"))$("#again-a").onclick=()=>{newPass(sec,s,"all");render()};
      goBtn.onclick=()=>next(sec,s);
      return;
    }
    const card=$("#card");
    const flip=()=>{f.flip=!f.flip;save();render()};
    card.onclick=flip;
    const mark=(ok)=>{if(!f.flip)return;const k=f.order[f.pos];(ok?f.got:f.missed).push(k);(f.hist=f.hist||[]).push(ok?1:0);f.pos++;f.flip=false;save();render();const c2=$("#card");if(c2){c2.classList.add(ok?"flash-ok":"flash-no")}};
    $("#got").onclick=()=>mark(true);$("#miss").onclick=()=>mark(false);
    bindStep.mark=mark;bindStep.flip=flip;
  }
  if(s.step===4){
    const ta=$("#dump");ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
    ta.oninput=()=>{s.dump=ta.value;save()};
    const goal=S.settings.dumpMin*60000;let reached=false;
    const frame=()=>{const el=Date.now()-s.dumpStart;setClock($("#dt"),fmt(el));setDial("marc",el/goal,18);
      if(el>=goal&&!reached){reached=true;$("#goal").textContent="goal reached";$("#mini").classList.add("full")}
      if(!still.matches&&!reached)raf=requestAnimationFrame(frame)};
    frame();tick=setInterval(()=>{setClock($("#dt"),fmt(Date.now()-s.dumpStart));if(reached||still.matches)frame()},1000);
    bindPad(s);
    goBtn.onclick=()=>{s.dump=ta.value;s.got={};next(sec,s)};
  }
  if(s.step===5){
    const pr=$("#padro");if(pr){pr.style.aspectRatio=String(1/(s.sketch.a||.45));paint(pr,s.sketch,true)}
    document.querySelectorAll(".pt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;s.got[k]=!s.got[k];save();const y=scrollY;render();scrollTo(0,y)});
    const total=sec.points.length,missedK=sec.points.map((p,k)=>k).filter(k=>!s.got[k]);
    const record=()=>{s.history.push({round:s.round,got:total-missedK.length,total});s.dump="";s.sketch=null;s.dumpStart=0;s.timerEnd=0};
    if($("#loop"))$("#loop").onclick=()=>{record();s.focus=missedK;s.round++;s.step=0;s.got={};s.fc=null;save();render();scrollTo({top:0,behavior:"smooth"})};
    if($("#moveon"))$("#moveon").onclick=()=>{record();s.focus=missedK;s.status="revisit";s.round++;s.step=0;s.got={};s.fc=null;const n=nextNew(sec);save();go(n?n.id:null)};
    if($("#finish"))$("#finish").onclick=()=>{record();s.status="done";s.focus=[];s.step=0;s.round=1;s.got={};s.fc=null;const n=nextNew(sec);save();toast("Section "+(idx(sec.id)+1)+" done");go(n?n.id:null)};
  }
}
/* Sketch: strokes are stored as points scaled to the canvas width, so they redraw at any size and in either theme */
function paint(cv,sk,ro){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth;if(!w)return;
  const h=ro?Math.round(w*(sk.a||.45)):cv.clientHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);c.lineCap="round";c.lineJoin="round";
  const ink=getComputedStyle(document.body).color;
  (sk.k||[]).forEach(st=>{c.globalCompositeOperation=st.e?"destination-out":"source-over";c.strokeStyle=ink;c.lineWidth=st.w*w;c.beginPath();st.p.forEach((pt,i)=>{const x=pt[0]*w,y=pt[1]*w;i?c.lineTo(x,y):c.moveTo(x,y)});if(st.p.length===1)c.lineTo(st.p[0][0]*w+.01,st.p[0][1]*w);c.stroke()});
  c.globalCompositeOperation="source-over";
}
function bindPad(s){
  const cv=$("#pad");if(!cv)return;
  if(!s.sketch)s.sketch={a:0,k:[],prev:null};
  const sk=s.sketch;let erase=false,cur=null;
  const fit=()=>{sk.a=cv.clientHeight/cv.clientWidth;paint(cv,sk,false)};fit();
  const ro=new ResizeObserver(()=>paint(cv,sk,false));ro.observe(cv);
  const pt=e=>{const r=cv.getBoundingClientRect();return [+((e.clientX-r.left)/r.width).toFixed(4),+((e.clientY-r.top)/r.width).toFixed(4)]};
  cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur={e:erase,w:erase?.04:.0045,p:[pt(e)]};sk.k.push(cur);sk.prev=null;paint(cv,sk,false)};
  cv.onpointermove=e=>{if(!cur)return;cur.p.push(pt(e));paint(cv,sk,false)};
  const end=()=>{if(!cur)return;cur=null;sk.a=cv.clientHeight/cv.clientWidth;save()};
  cv.onpointerup=end;cv.onpointercancel=end;
  const tool=v=>{erase=v;$("#tpen").setAttribute("aria-pressed",String(!v));$("#tera").setAttribute("aria-pressed",String(v))};
  $("#tpen").onclick=()=>tool(false);$("#tera").onclick=()=>tool(true);
  $("#tundo").onclick=()=>{if(sk.k.length)sk.k.pop();else if(sk.prev){sk.k=sk.prev;sk.prev=null}save();paint(cv,sk,false)};
  $("#tclr").onclick=()=>{if(!sk.k.length)return;sk.prev=sk.k;sk.k=[];save();paint(cv,sk,false);toast("Sketch cleared. Undo brings it back.")};
}
function fallback(txt){const box=$("#qbox");if(!box)return;box.innerHTML='<textarea class="copybox" id="cb" readonly></textarea><p class="small">Your browser blocked copying. Press Cmd C (or Ctrl C) now, the text is selected.</p>';const cb=$("#cb");cb.value=txt;cb.focus();cb.select()}

document.addEventListener("click",e=>{const b=e.target.closest("#side [data-go]");if(b)go(b.dataset.go)});
document.addEventListener("keydown",e=>{
  if(!S.cur)return;const s=st(S.cur);const tag=(e.target.tagName||"").toLowerCase();
  if(s.step===4){if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();$("#go").click()}return}
  if(tag==="textarea"||tag==="select"||tag==="input")return;
  if(s.step===2&&s.fc&&(e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z")){e.preventDefault();bindStep.undo&&bindStep.undo();return}
  if(s.step===2&&s.fc&&s.fc.pos<s.fc.order.length){
    if(e.key===" "){e.preventDefault();bindStep.flip&&bindStep.flip()}
    else if(e.key==="ArrowRight"){e.preventDefault();bindStep.mark&&bindStep.mark(true)}
    else if(e.key==="ArrowLeft"){e.preventDefault();bindStep.mark&&bindStep.mark(false)}
    return;
  }
  if(e.key==="Enter"&&tag!=="button"&&tag!=="a"){const g=$("#go");if(g){e.preventDefault();g.click()}}
});
let lastNarrow=matchMedia("(max-width:860px)").matches;
addEventListener("resize",()=>{const n=matchMedia("(max-width:860px)").matches;if(n!==lastNarrow){lastNarrow=n;renderSide()}});
document.title=DECK.title;
render();
})();
</script>
</body>
</html>
