<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="-apple-system,Helvetica Neue,Arial,sans-serif">
<rect width="900" height="300" fill="#fff"/>
<rect x="20" y="20" width="270" height="260" rx="16" fill="#f5f5f7"/>
<circle cx="155" cy="95" r="44" fill="none" stroke="#1d1d1f" stroke-width="3"/>
<path d="M135 92 q20 -22 40 0 q-20 22 -40 0" fill="none" stroke="#c4001a" stroke-width="3"/>
<text x="155" y="175" text-anchor="middle" font-size="21" font-weight="700">Internal</text>
<text x="155" y="200" text-anchor="middle" font-size="14" fill="#6e6e73">a fight inside the mind</text>
<text x="155" y="232" text-anchor="middle" font-size="15">Mrs. Das's guilt</text>
<text x="155" y="254" text-anchor="middle" font-size="15">Mr. Kapasi's loneliness</text>
<rect x="310" y="20" width="570" height="260" rx="16" fill="#f5f5f7"/>
<text x="595" y="58" text-anchor="middle" font-size="21" font-weight="700">External</text>
<text x="595" y="82" text-anchor="middle" font-size="14" fill="#6e6e73">a fight with someone or something outside</text>
<rect x="335" y="105" width="250" height="155" rx="12" fill="#fff" stroke="#1d1d1f"/>
<text x="460" y="138" text-anchor="middle" font-size="17" font-weight="700">Person vs person</text>
<text x="460" y="170" text-anchor="middle" font-size="15">Mr. and Mrs. Das bicker</text>
<text x="460" y="194" text-anchor="middle" font-size="15">Mr. Kapasi vs Mrs. Das</text>
<text x="460" y="216" text-anchor="middle" font-size="15">at the climax</text>
<rect x="605" y="105" width="250" height="155" rx="12" fill="#e9f7ee" stroke="#1a8f3c" stroke-width="2"/>
<text x="730" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#127a35">Person vs nature</text>
<text x="730" y="170" text-anchor="middle" font-size="15">Bobby vs the monkeys</text>
<text x="730" y="200" text-anchor="middle" font-size="13" fill="#3a3a3c">animals and weather</text>
<text x="730" y="218" text-anchor="middle" font-size="13" fill="#3a3a3c">count as nature</text>
</svg>
