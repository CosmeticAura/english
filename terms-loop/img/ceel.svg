<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system,Helvetica Neue,Arial,sans-serif">
<rect width="900" height="400" fill="#fff"/>
<g font-size="15">
<rect x="10" y="10" width="880" height="86" rx="14" fill="#e8f0ff"/>
<text x="30" y="44" font-size="22" font-weight="800" fill="#0a3fae">1 Claim</text><text x="190" y="44" font-weight="600">Name the technique and what it shows.</text>
<text x="190" y="72" fill="#3a3a3c">Lahiri uses situational irony to show understanding is about more than language.</text>
<rect x="10" y="106" width="880" height="86" rx="14" fill="#f5f5f7"/>
<text x="30" y="140" font-size="22" font-weight="800">2 Evidence</text><text x="190" y="140" font-weight="600">A real quote or moment.</text>
<text x="190" y="168" fill="#3a3a3c">He asks, "Is it really pain you feel, Mrs. Das, or is it guilt?" and she walks away.</text>
<rect x="10" y="202" width="880" height="86" rx="14" fill="#e9f7ee"/>
<text x="30" y="236" font-size="22" font-weight="800" fill="#127a35">3 Explain</text><text x="190" y="236" font-weight="600">How the evidence proves the claim.</text>
<text x="190" y="264" fill="#3a3a3c">The man paid to understand others can't understand the one person who asks him to.</text>
<rect x="10" y="298" width="880" height="86" rx="14" fill="#fff4e0"/>
<text x="30" y="332" font-size="22" font-weight="800" fill="#a05a00">4 Link</text><text x="190" y="332" font-weight="600">Tie it to the theme.</text>
<text x="190" y="360" fill="#3a3a3c">People can share a language and still fail to understand each other.</text>
</g></svg>
