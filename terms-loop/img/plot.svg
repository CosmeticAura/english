<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" font-family="-apple-system,Helvetica Neue,Arial,sans-serif">
<rect width="1000" height="610" fill="#fff"/>
<polygon points="30,520 230,520 500,150 770,520 970,520 970,530 30,530" fill="#f2f6ff"/>
<polyline points="30,520 230,520 500,150 770,520 970,520" fill="none" stroke="#1d1d1f" stroke-width="4" stroke-linejoin="round"/>
<text x="30" y="34" font-size="14" fill="#6e6e73">Acronym, first letters in order</text>
<text x="30" y="58" font-size="18" font-weight="700" fill="#0a3fae">Every Influencer Records Content,</text>
<text x="30" y="82" font-size="18" font-weight="700" fill="#0a3fae">Can't Resist Filming Random Drama</text>
<g fill="#007aff"><circle cx="70" cy="520" r="8"/><circle cx="230" cy="520" r="8"/><circle cx="324" cy="390" r="8"/><circle cx="419" cy="261" r="8"/></g>
<circle cx="500" cy="150" r="12" fill="#ff3b30"/>
<g fill="#34c759"><circle cx="567" cy="242" r="8"/><circle cx="662" cy="372" r="8"/><circle cx="770" cy="520" r="8"/><circle cx="890" cy="520" r="8"/></g>
<text x="500" y="82" text-anchor="middle" font-size="20" font-weight="700" fill="#c4001a">5 Climax</text>
<text x="500" y="103" text-anchor="middle" font-size="14.5" fill="#1d1d1f">the turning point, highest tension</text>
<line x1="514" y1="150" x2="640" y2="150" stroke="#c4001a" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="646" y="146" font-size="13.5" font-style="italic" fill="#6e6e73">Story: "Is it really pain you feel,</text>
<text x="646" y="164" font-size="13.5" font-style="italic" fill="#6e6e73">Mrs. Das, or is it guilt?"</text>
<text x="30" y="555" text-anchor="start" font-size="18" font-weight="700" fill="#0a3fae">1 Exposition</text><text x="30" y="575" text-anchor="start" font-size="14.5" fill="#1d1d1f">who, where, when: the normal world</text><text x="30" y="594" text-anchor="start" font-size="13.5" font-style="italic" fill="#6e6e73">Story: the tour to Konarak starts</text><text x="30" y="438" text-anchor="start" font-size="18" font-weight="700" fill="#0a3fae">2 Inciting incident</text><text x="30" y="458" text-anchor="start" font-size="14.5" fill="#1d1d1f">the event that starts the story</text><text x="30" y="477" text-anchor="start" font-size="13.5" font-style="italic" fill="#6e6e73">Story: "But so romantic"</text><text x="298" y="370" text-anchor="end" font-size="18" font-weight="700" fill="#0a3fae">3 Rising action</text><text x="298" y="390" text-anchor="end" font-size="14.5" fill="#1d1d1f">tension builds up</text><text x="298" y="409" text-anchor="end" font-size="13.5" font-style="italic" fill="#6e6e73">Story: his address, the letter daydream</text><text x="396" y="236" text-anchor="end" font-size="18" font-weight="700" fill="#0a3fae">4 Complication</text><text x="396" y="256" text-anchor="end" font-size="14.5" fill="#1d1d1f">a new problem right before the top</text><text x="396" y="275" text-anchor="end" font-size="13.5" font-style="italic" fill="#6e6e73">Story: her secret about Bobby</text><text x="603" y="232" text-anchor="start" font-size="18" font-weight="700" fill="#127a35">6 Reversal</text><text x="603" y="252" text-anchor="start" font-size="14.5" fill="#1d1d1f">the moment things flip</text><text x="603" y="271" text-anchor="start" font-size="13.5" font-style="italic" fill="#6e6e73">Story: monkeys follow the puffed rice</text><text x="700" y="362" text-anchor="start" font-size="18" font-weight="700" fill="#127a35">7 Falling action</text><text x="700" y="382" text-anchor="start" font-size="14.5" fill="#1d1d1f">what happens after, tension drops</text><text x="700" y="401" text-anchor="start" font-size="13.5" font-style="italic" fill="#6e6e73">Story: Bobby attacked, then rescued</text><text x="785" y="436" text-anchor="start" font-size="18" font-weight="700" fill="#127a35">8 Resolution</text><text x="785" y="456" text-anchor="start" font-size="14.5" fill="#1d1d1f">the problem gets settled</text><text x="785" y="475" text-anchor="start" font-size="13.5" font-style="italic" fill="#6e6e73">Story: back to the hotel</text><text x="970" y="555" text-anchor="end" font-size="18" font-weight="700" fill="#127a35">9 Denouement</text><text x="970" y="575" text-anchor="end" font-size="14.5" fill="#1d1d1f">the very last image</text><text x="970" y="594" text-anchor="end" font-size="13.5" font-style="italic" fill="#6e6e73">Story: his address slip blows away</text>
<text x="330" y="500" font-size="13" fill="#007aff" transform="rotate(-54 330 500)">his hope grows</text>
<text x="640" y="430" font-size="13" fill="#34a853" transform="rotate(54 640 430)">hope falls apart</text>
</svg>