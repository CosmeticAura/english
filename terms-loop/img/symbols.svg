<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="-apple-system,Helvetica Neue,Arial,sans-serif">
<rect width="900" height="250" fill="#fff"/>
<g>
<rect x="10" y="10" width="205" height="230" rx="16" fill="#e8f0ff"/>
<rect x="62" y="38" width="100" height="70" rx="4" fill="#fff" stroke="#1d1d1f" stroke-width="2.5" transform="rotate(-8 112 73)"/>
<g stroke="#8e8e93" stroke-width="2" transform="rotate(-8 112 73)"><line x1="74" y1="58" x2="150" y2="58"/><line x1="74" y1="74" x2="150" y2="74"/><line x1="74" y1="90" x2="130" y2="90"/></g>
<text x="112" y="150" text-anchor="middle" font-size="19" font-weight="700">Address slip</text>
<text x="112" y="182" text-anchor="middle" font-size="15" fill="#0a3fae">= his hope of</text>
<text x="112" y="202" text-anchor="middle" font-size="15" fill="#0a3fae">a connection</text></g>
<g>
<rect x="232" y="10" width="205" height="230" rx="16" fill="#ffecec"/>
<path d="M285 70 h100 a50 42 0 0 1 -100 0z" fill="#fff" stroke="#1d1d1f" stroke-width="2.5"/>
<g fill="#c9a96e"><circle cx="305" cy="64" r="6"/><circle cx="322" cy="58" r="6"/><circle cx="340" cy="63" r="6"/><circle cx="358" cy="57" r="6"/><circle cx="372" cy="65" r="6"/><circle cx="398" cy="96" r="5"/><circle cx="412" cy="108" r="5"/><circle cx="420" cy="122" r="5"/></g>
<text x="334" y="150" text-anchor="middle" font-size="19" font-weight="700">Puffed rice</text>
<text x="334" y="182" text-anchor="middle" font-size="15" fill="#c4001a">= her carelessness</text>
<text x="334" y="202" text-anchor="middle" font-size="13" fill="#3a3a3c">it leads the monkeys to Bobby</text></g>
<g>
<rect x="454" y="10" width="205" height="230" rx="16" fill="#f5f5f7"/>
<g fill="#1d1d1f"><ellipse cx="528" cy="72" rx="30" ry="22"/><ellipse cx="588" cy="72" rx="30" ry="22"/></g>
<path d="M558 70 q0 -8 0 0" stroke="#1d1d1f" stroke-width="5"/><line x1="556" y1="68" x2="560" y2="68" stroke="#1d1d1f" stroke-width="6"/>
<text x="557" y="150" text-anchor="middle" font-size="19" font-weight="700">Sunglasses</text>
<text x="557" y="182" text-anchor="middle" font-size="15">= Mrs. Das hiding</text>
<text x="557" y="202" text-anchor="middle" font-size="15">from everyone</text></g>
<g>
<rect x="676" y="10" width="214" height="230" rx="16" fill="#f5f5f7"/>
<rect x="730" y="46" width="106" height="66" rx="10" fill="#1d1d1f"/><rect x="752" y="36" width="30" height="14" rx="3" fill="#1d1d1f"/>
<circle cx="783" cy="79" r="22" fill="#fff"/><circle cx="783" cy="79" r="13" fill="#1d1d1f"/>
<text x="783" y="150" text-anchor="middle" font-size="19" font-weight="700">Mr. Das's camera</text>
<text x="783" y="182" text-anchor="middle" font-size="15">= seeing life through</text>
<text x="783" y="202" text-anchor="middle" font-size="15">a lens, not looking</text></g>
